<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <style>
    .noise{animation:noiseJit 1.4s ease-in-out infinite}
    .vocal{stroke-dasharray:460;animation:vocalFlow 2.6s ease-in-out infinite}
    .core{transform-box:fill-box;transform-origin:center;animation:corePulse 1.8s ease-in-out infinite}
    .gateLine{animation:gateGlow 2s ease-in-out infinite}
    @keyframes noiseJit{0%,100%{opacity:.45;transform:scaleY(1)}50%{opacity:.85;transform:scaleY(.84)}}
    @keyframes vocalFlow{0%{stroke-dashoffset:460}45%,100%{stroke-dashoffset:0}}
    @keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
    @keyframes gateGlow{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="ac-gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ff6900" stop-opacity="0.95"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="ac-glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <line x1="60" y1="120" x2="580" y2="120" stroke="#27272a"/>
  <!-- Left noisy accompaniment wave -->
  <g class="noise" style="transform-box:fill-box;transform-origin:center;">
    <path d="M74 120 L92 66 L110 174 L126 52 L144 186 L160 62 L178 178 L194 74 L212 166 L228 84 L246 154 L264 96 L282 142 L300 110 L316 120" stroke="#71717a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M74 120 C100 94 120 146 146 120 C172 94 192 146 218 120 C244 94 268 142 316 120" stroke="#3f3f46" stroke-width="1.3"/>
  </g>
  <!-- Separation line -->
  <line class="gateLine" x1="320" y1="26" x2="320" y2="214" stroke="url(#ac-gate)" stroke-width="2"/>
  <circle class="core" cx="320" cy="120" r="5" fill="#ffffff" filter="url(#ac-glow)"/>
  <!-- Right clean luminous vocal wave -->
  <path d="M320 120 C354 46 392 46 426 120 C460 194 498 194 532 120 C548 86 562 86 574 120" stroke="#ff6900" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
  <path class="vocal" d="M320 120 C354 46 392 46 426 120 C460 194 498 194 532 120 C548 86 562 86 574 120" stroke="#ff6900" stroke-width="3" stroke-linecap="round" filter="url(#ac-glow)"/>
</svg>
